<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E2472B">
<title>Home Reps</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: one-column phone app, figure-first, bottom tab bar like a training log */
:root{
  --bg:#EDF0F3; --surface:#FFFFFF; --ink:#151A21; --muted:#5E6773; --line:#D7DCE3;
  --skin:#CDD3DB; --muscle:#A9B2BE; --muscle-hover:#8E99A7;
  --accent:#E2472B; --accent-ink:#FFFFFF; --accent-soft:#FBE1DA; --good:#1C8A57; --good-soft:#DDF2E7;
  --display:"Barlow Condensed","Arial Narrow",Impact,sans-serif;
  --text:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#101318; --surface:#191E25; --ink:#EDF0F3; --muted:#9AA3AE; --line:#2B323C;
  --skin:#2A313A; --muscle:#46505D; --muscle-hover:#5A6574;
  --accent:#FF6448; --accent-ink:#1A0A06; --accent-soft:#3B1F18; --good:#43C88A; --good-soft:#163326; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101318; --surface:#191E25; --ink:#EDF0F3; --muted:#9AA3AE; --line:#2B323C;
  --skin:#2A313A; --muscle:#46505D; --muscle-hover:#5A6574;
  --accent:#FF6448; --accent-ink:#1A0A06; --accent-soft:#3B1F18; --good:#43C88A; --good-soft:#163326; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--text);font-size:15px;line-height:1.45}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.app{max-width:540px;margin:0 auto;padding-inline:16px;padding-block:12px 110px}
header.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding-block:6px 10px}
.brand{font-family:var(--display);font-weight:700;font-size:30px;letter-spacing:.02em;text-transform:uppercase;line-height:1}
.brand span{color:var(--accent)}
.date{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
h2{font-family:var(--display);font-weight:700;text-transform:uppercase;letter-spacing:.03em;font-size:26px;line-height:1.05;margin:0;text-wrap:balance}
h3{font-family:var(--display);font-weight:600;text-transform:uppercase;letter-spacing:.06em;font-size:15px;color:var(--muted);margin:22px 0 8px}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.view[hidden]{display:none}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* segmented */
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:none;padding:7px 16px;border-radius:999px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

/* body figure */
.figure-wrap{display:grid;grid-template-columns:1fr;justify-items:center;position:relative;margin-top:6px}
svg.body{width:min(100%,250px);height:auto;display:block;touch-action:manipulation}
svg.body .skin{fill:var(--skin)}
svg.body .m{fill:var(--muscle);stroke:var(--bg);stroke-width:1.2;cursor:pointer;transition:fill .15s}
svg.body .m:hover{fill:var(--muscle-hover)}
svg.body .m.on{fill:var(--accent)}
svg.body .m:focus{outline:none}
svg.body .m:focus-visible{stroke:var(--ink);stroke-width:2}
svg.body .detail{stroke:var(--bg);stroke-width:1.2;fill:none;pointer-events:none}
.figure-hint{position:absolute;left:0;top:4px;font-size:12px;color:var(--muted);max-width:110px}
.side-tag{position:absolute;right:0;top:4px;font-family:var(--display);font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-size:14px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

/* exercise cards */
.list{display:flex;flex-direction:column;gap:8px}
.ex{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center}
.ex .name{font-weight:700;font-size:16px}
.ex .meta{grid-column:1;display:flex;gap:6px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.ex .meta b{font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.tag{border:1px solid var(--line);border-radius:6px;padding:1px 6px}
.lvl{display:inline-flex;gap:2px;align-items:center}
.lvl i{width:6px;height:10px;border-radius:2px;background:var(--line);display:inline-block}
.lvl i.f{background:var(--accent)}
.ex .actions{grid-row:1/span 2;grid-column:2;display:flex;flex-direction:column;gap:6px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;font-weight:600;font-size:14px;white-space:nowrap}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.wide{width:100%;padding:12px}
.empty{border:1.5px dashed var(--line);border-radius:var(--r);padding:18px;text-align:center;color:var(--muted)}

/* panel */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.kpi{display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi .v{font-family:var(--display);font-weight:700;font-size:28px;line-height:1;font-variant-numeric:tabular-nums}
.kpi .l{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.macro-bar{display:flex;height:12px;border-radius:6px;overflow:hidden;margin-top:14px;background:var(--line)}
.macro-bar span{display:block;height:100%}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.c-p{background:var(--accent)} .c-c{background:#D99A1E} .c-f{background:#4A7BD0}

/* form */
form.q{display:grid;grid-template-columns:1fr 1fr;gap:12px}
form.q .full{grid-column:1/-1}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;min-width:0}
label.f input,label.f select{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px;font-weight:500;width:100%;min-width:0}
fieldset{border:0;margin:0;padding:0;grid-column:1/-1}
legend{font-size:13px;font-weight:600;margin-bottom:6px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{position:relative}
.opt input{position:absolute;opacity:0;inset:0;cursor:pointer}
.opt span{display:block;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:14px;font-weight:600;background:var(--bg)}
.opt span small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.opt input:checked+span{border-color:var(--accent);background:var(--accent-soft)}
.opt input:focus-visible+span{outline:3px solid var(--accent);outline-offset:2px}
.banner{background:var(--accent-soft);border-radius:10px;padding:10px 12px;font-size:13.5px}

/* meals */
.meal{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.meal .t{font-weight:700}
.meal .n{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}

/* today */
.day-hero{background:var(--ink);color:var(--bg);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:6px}
.day-hero .k{font-family:var(--display);font-weight:600;letter-spacing:.1em;text-transform:uppercase;font-size:13px;opacity:.75}
.day-hero h2{font-size:32px}
.day-hero .facts{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;margin-top:4px;font-variant-numeric:tabular-nums}
.progress{height:6px;border-radius:3px;background:color-mix(in srgb,var(--bg) 25%,transparent);overflow:hidden;margin-top:8px}
.progress span{display:block;height:100%;background:var(--accent);transition:width .3s}
.check{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.check input{width:24px;height:24px;accent-color:var(--good);margin:0}
.check.done{background:var(--good-soft);border-color:transparent}
.check.done .name{text-decoration:line-through;text-decoration-color:var(--good)}
.check .name{font-weight:700}
.check .sub{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.week-strip{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:4px}
.week-strip button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:11px;color:var(--muted)}
.week-strip button b{font-family:var(--display);font-size:17px;color:var(--ink)}
.week-strip button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent)}
.week-strip button[aria-pressed="true"],.week-strip button[aria-pressed="true"] b{color:var(--accent-ink)}
.week-strip .dot{width:5px;height:5px;border-radius:50%;background:transparent}
.week-strip .dot.has{background:var(--accent)}
.week-strip button[aria-pressed="true"] .dot.has{background:var(--accent-ink)}

/* schedule */
.sched-item{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.sched-item .name{font-weight:700}
.stepper{display:flex;align-items:center;gap:4px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.stepper button{width:28px;height:28px;border-radius:8px;border:1px solid var(--line);background:var(--bg);font-weight:700;padding:0}
.icon-btns{display:flex;gap:4px}
.icon-btns button{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--bg);padding:0;font-size:15px;line-height:1}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,12,16,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:540px;max-height:86%;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;animation:up .2s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
.sheet ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line);align-self:center}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.days button{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 0;font-weight:700;font-size:13px}
.days button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

/* tab bar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
nav.tabs .in{max-width:540px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
nav.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-radius:10px;color:var(--muted);font-size:11.5px;font-weight:600}
nav.tabs button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-selected="true"]{color:var(--accent)}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:14px;font-weight:600;z-index:50;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:380px){.kpi .v{font-size:23px}.ex{grid-template-columns:1fr}.ex .actions{grid-row:auto;grid-column:1;flex-direction:row}}
</style>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>

<div class="app">
  <header class="top">
    <div class="brand">Home<span>Reps</span></div>
    <div class="date" id="today-date"></div>
  </header>

  <!-- BODY -->
  <section class="view" id="v-body" aria-labelledby="t-body">
    <div class="row" style="justify-content:space-between">
      <h2>Pick a muscle</h2>
      <div class="seg" role="group" aria-label="Body side">
        <button id="side-front" aria-pressed="true">Front</button>
        <button id="side-back" aria-pressed="false">Back</button>
      </div>
    </div>
    <div class="figure-wrap">
      <p class="figure-hint">Tap a muscle to see exercises you can do at home.</p>
      <span class="side-tag" id="side-tag">Front</span>
      <div id="figure"></div>
    </div>
    <div class="chips" id="group-chips" aria-label="Muscle groups"></div>
    <div id="group-detail"></div>
  </section>

  <!-- TODAY -->
  <section class="view" id="v-today" hidden>
    <div class="week-strip" id="week-strip" aria-label="Choose a day"></div>
    <div id="today-content" class="stack" style="margin-top:12px"></div>
  </section>

  <!-- FOOD -->
  <section class="view" id="v-food" hidden>
    <h2>Food plan</h2>
    <p class="muted small" style="margin-top:4px">Answer a few questions and get daily targets and meal ideas for your goal.</p>
    <div id="food-results" class="stack" style="margin-top:14px"></div>
    <h3>Your answers</h3>
    <form class="q panel" id="qform" novalidate>
      <fieldset>
        <legend>Main goal</legend>
        <div class="opts">
          <label class="opt"><input type="radio" name="goal" value="lose" id="g-lose"><span>Lose fat<small>Calorie deficit, high protein</small></span></label>
          <label class="opt"><input type="radio" name="goal" value="gain" id="g-gain"><span>Build muscle<small>Small surplus, high protein</small></span></label>
          <label class="opt"><input type="radio" name="goal" value="tone" id="g-tone"><span>Tone and maintain<small>Eat at maintenance</small></span></label>
          <label class="opt"><input type="radio" name="goal" value="endure" id="g-endure"><span>Fitness and stamina<small>More carbs for energy</small></span></label>
        </div>
      </fieldset>
      <label class="f">Sex
        <select name="sex" id="q-sex"><option value="f">Female</option><option value="m">Male</option></select>
      </label>
      <label class="f">Age
        <input type="number" name="age" id="q-age" min="14" max="90" inputmode="numeric">
      </label>
      <label class="f">Height (cm)
        <input type="number" name="height" id="q-height" min="120" max="230" inputmode="numeric">
      </label>
      <label class="f">Weight (kg)
        <input type="number" name="weight" id="q-weight" min="35" max="250" step="0.1" inputmode="decimal">
      </label>
      <label class="f full">How active are you outside workouts?
        <select name="activity" id="q-activity">
          <option value="1.2">Mostly sitting (desk job)</option>
          <option value="1.375">Lightly active (walks, standing)</option>
          <option value="1.55">Active (on my feet most of the day)</option>
          <option value="1.725">Very active (physical job)</option>
        </select>
      </label>
      <label class="f">Training experience
        <select name="level" id="q-level">
          <option value="1">Beginner</option><option value="2">Some experience</option><option value="3">Advanced</option>
        </select>
      </label>
      <label class="f">Diet
        <select name="diet" id="q-diet">
          <option value="any">Everything</option><option value="veg">Vegetarian</option><option value="vegan">Vegan</option>
        </select>
      </label>
      <label class="f full">Meals per day
        <select name="meals" id="q-meals"><option value="3">3 meals</option><option value="4">3 meals + 1 snack</option><option value="5">3 meals + 2 snacks</option></select>
      </label>
      <button class="btn primary wide full" type="submit">Save and update my plan</button>
    </form>
  </section>

  <!-- SCHEDULE -->
  <section class="view" id="v-sched" hidden>
    <div class="row" style="justify-content:space-between">
      <h2>My schedule</h2>
      <button class="btn sm ghost" id="clear-sched">Clear week</button>
    </div>
    <p class="muted small" style="margin-top:4px">Add exercises from the body view with <b>+ Schedule</b>. They show up here and on the Today tab.</p>
    <div id="sched-content" class="stack" style="margin-top:12px"></div>
  </section>
</div>

<nav class="tabs" aria-label="Sections">
  <div class="in" role="tablist">
    <button role="tab" data-tab="body" id="t-body" aria-selected="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="4.5" r="2.2"/><path d="M5 8.5h14M12 8.5v6M12 14.5l-3.5 7M12 14.5l3.5 7"/></svg>Body</button>
    <button role="tab" data-tab="today" id="t-today" aria-selected="false"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4M9 15l2 2 4-4"/></svg>Today</button>
    <button role="tab" data-tab="food" id="t-food" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M7 3v8M5 3v5a2 2 0 0 0 4 0V3M7 11v10M17 21V3c-2.5 1.5-3.5 4-3.5 8h3.5"/></svg>Food</button>
    <button role="tab" data-tab="sched" id="t-sched" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M8 6h12M8 12h12M8 18h12"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/></svg>Schedule</button>
  </div>
</nav>

<div id="sheet-root"></div>
<div id="toast-root" aria-live="polite"></div>

<script>
/* ---------- storage ---------- */
const store = {
  get(k, d){ try{ const v = localStorage.getItem('homereps.'+k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem('homereps.'+k, JSON.stringify(v)); }catch(e){} }
};

/* ---------- muscle groups ---------- */
const GROUPS = {
  chest:{label:'Chest'}, shoulders:{label:'Shoulders'}, biceps:{label:'Biceps'}, triceps:{label:'Triceps'},
  forearms:{label:'Forearms'}, abs:{label:'Abs'}, obliques:{label:'Obliques'}, traps:{label:'Traps'},
  upperback:{label:'Upper back'}, lowerback:{label:'Lower back'}, glutes:{label:'Glutes'},
  quads:{label:'Quads'}, hamstrings:{label:'Hamstrings'}, calves:{label:'Calves'}
};
const FRONT = ['shoulders','chest','biceps','forearms','abs','obliques','quads','calves'];
const BACK  = ['traps','shoulders','upperback','triceps','forearms','lowerback','glutes','hamstrings','calves'];

/* ---------- exercises: [id, name, groups, equipment, level 1-3, dose, unit, steps] ---------- */
const EX_RAW = [
 ['pushup','Push-up',['chest','triceps','shoulders'],'None',1,12,'reps',['Hands just wider than shoulders, body in one straight line.','Lower your chest to a fist above the floor.','Push back up without letting your hips sag.']],
 ['incline-pushup','Incline push-up',['chest','triceps'],'Couch or table',1,12,'reps',['Hands on the edge of a sturdy couch or table.','Walk feet back until your body is straight.','Lower your chest to the edge, then press away.']],
 ['wide-pushup','Wide push-up',['chest','shoulders'],'None',2,10,'reps',['Place hands about one and a half shoulder widths apart.','Lower slowly for 2 seconds.','Press up, squeezing your chest at the top.']],
 ['decline-pushup','Decline push-up',['chest','shoulders'],'Chair',3,10,'reps',['Feet on a chair seat, hands on the floor.','Keep your core tight and lower your chest.','Press up. Higher feet makes it harder.']],
 ['pike-pushup','Pike push-up',['shoulders','triceps'],'None',2,8,'reps',['Start in downward dog with hips high.','Bend your elbows and lower the top of your head toward the floor.','Press back up through your shoulders.']],
 ['bottle-raise','Lateral raise with water bottles',['shoulders'],'2 water bottles',1,15,'reps',['Stand tall with a full bottle in each hand.','Raise arms out to the side to shoulder height.','Lower slowly over 2 seconds.']],
 ['shoulder-taps','Plank shoulder taps',['shoulders','abs'],'None',1,20,'reps',['Start in a high plank, feet wide.','Tap your left shoulder with your right hand, then switch.','Keep hips still; count each tap.']],
 ['backpack-press','Backpack overhead press',['shoulders','triceps'],'Loaded backpack',2,10,'reps',['Hold a loaded backpack by the sides at chin height.','Press it straight overhead until arms are long.','Lower with control to your chin.']],
 ['wall-hs','Wall handstand hold',['shoulders','traps'],'Wall',3,30,'sec',['Walk your feet up a wall from a plank, belly facing the wall.','Stack hands under shoulders and push the floor away.','Hold, breathing steadily. Walk down slowly.']],

function saveDays(id){
  const picked = [...document.querySelectorAll('#day-pick button')].filter(b=>b.getAttribute('aria-pressed')==='true').map(b=>b.dataset.day);
  DAYS.forEach(d => {
    const has = schedule[d].some(x=>x.id===id);
    if (picked.includes(d) && !has) schedule[d].push({id, sets:3, dose:EX[id].dose});
    if (!picked.includes(d) && has) schedule[d] = schedule[d].filter(x=>x.id!==id);
  });
  store.set('schedule', schedule); closeSheet();
  toast(picked.length ? `${EX[id].name} added to ${picked.map(d=>DAY_LABEL[d]).join(', ')}` : `${EX[id].name} removed from your schedule`);
  render();
}

const PLAN = {
  mon:{title:'Push day',focus:['chest','shoulders','triceps'],note:'Chest, shoulders and triceps.'},
  tue:{title:'Legs',focus:['quads','glutes','calves','hamstrings'],note:'Quads, glutes and calves.'},
  wed:{title:'Core and cardio',focus:['abs','obliques','lowerback'],note:'Abs, obliques and lower back.'},
  thu:{title:'Pull day',focus:['upperback','biceps','traps','forearms'],note:'Back, biceps and grip.'},
  fri:{title:'Full body',focus:['chest','quads','upperback','abs','glutes'],note:'One move for every big muscle.'},
  sat:{title:'Glutes and conditioning',focus:['glutes','hamstrings','calves','abs'],note:'Back of the legs plus cardio.'},
  sun:{title:'Rest and mobility',focus:[],note:'Let your muscles recover. A walk and gentle stretching.'}
};
const STRETCHES = [['Cat-cow','10 slow rounds'],['Hip flexor stretch','45 sec each side'],['Hamstring stretch','45 sec each side'],['Chest doorway stretch','30 sec each side'],["Child's pose",'60 sec'],['Easy walk','20–30 min']];
const P_ = () => profile || EXAMPLE_PROFILE;
function weekNo(){ const d=new Date(); const s=new Date(d.getFullYear(),0,1); return Math.floor((d-s)/604800000); }
function recommend(day){
  const plan = PLAN[day], p = P_(), lvl = +p.level;
  if (!plan.focus.length) return {plan, items:[], sets:0};
  const count = 3 + lvl, sets = 1 + lvl, shift = weekNo() + DAYS.indexOf(day);
  const picked = [];
  for (let i=0; picked.length<count && i<20; i++){
    const g = plan.focus[i % plan.focus.length];
    const pool = exFor(g).filter(e => e.level <= lvl && !picked.some(x=>x.id===e.id));
    if (pool.length) picked.push(pool[(shift + Math.floor(i/plan.focus.length)) % pool.length]);
  }
  const scale = p.goal==='endure' ? 1.25 : p.goal==='gain' ? 0.85 : 1;
  return {plan, sets, items: picked.map(e => ({id:e.id, sets, dose: Math.round(e.dose*scale)}))};
}
const GOAL_TXT = {lose:'Fat loss',gain:'Muscle building',tone:'Tone and maintain',endure:'Fitness and stamina'};
const REST = {lose:'45 sec',gain:'90 sec',tone:'60 sec',endure:'30 sec'};
const CARDIO = {lose:20,gain:0,tone:10,endure:25};
function drawToday(){
  const day = ui.day || todayKey(), isToday = day===todayKey();
  const now = new Date(), monday = new Date(now); monday.setDate(now.getDate() - DAYS.indexOf(todayKey()));
  document.getElementById('week-strip').innerHTML = DAYS.map((d,i)=>{
    const dt = new Date(monday); dt.setDate(monday.getDate()+i);
    return `<button data-pickday="${d}" aria-pressed="${d===day}">${DAY_LABEL[d]}<b>${dt.getDate()}</b><span class="dot ${schedule[d].length?'has':''}"></span></button>`;
  }).join('');
  const dayDate = new Date(monday); dayDate.setDate(monday.getDate()+DAYS.indexOf(day));
  const key = dateStr(dayDate), done = new Set(doneLog[key] || []);
  const rec = recommend(day), p = P_();
  const mine = schedule[day];
  const all = [...mine.map(x=>'s:'+x.id), ...rec.items.map(x=>'r:'+x.id)];
  const pct = all.length ? Math.round(all.filter(k=>done.has(k)).length / all.length * 100) : 0;
  const cardio = rec.plan.focus.length ? CARDIO[p.goal] + (['wed','sat'].includes(day)?10:0) : 0;
  const row = (x, pre) => { const e = EX[x.id], k = pre+x.id, d = done.has(k);
    return `<label class="check ${d?'done':''}"><input type="checkbox" data-done="${k}" data-date="${key}" ${d?'checked':''}>
      <span><span class="name">${esc(e.name)}</span><br><span class="sub">${x.sets} × ${doseText(x.dose,e.unit)} · ${esc(e.equip)}</span></span>
      <button class="btn sm ghost" data-info="${e.id}" type="button">How to</button></label>`; };
  let h = `<div class="day-hero">
    <span class="k">${isToday?'Today':''} ${DAY_FULL[day]}</span>
    <h2>${mine.length ? 'Your workout' : rec.plan.title}</h2>
    <p class="small" style="opacity:.85">${mine.length ? `${mine.length} exercises from your schedule, plus today's suggestions below.` : rec.plan.note}</p>
    <div class="facts"><span>Goal: <b>${GOAL_TXT[p.goal]}</b></span>${rec.plan.focus.length?`<span>Rest <b>${REST[p.goal]}</b> between sets</span>`:''}${cardio?`<span>Cardio <b>${cardio} min</b></span>`:''}</div>
    ${all.length?`<div class="progress" aria-label="${pct}% done"><span style="width:${pct}%"></span></div>`:''}
  </div>`;
  if (!profile) h += `<p class="banner">These suggestions use an example profile. <button class="btn sm" data-goto="food" style="margin-left:4px">Fill in the questionnaire</button> to match your goal and level.</p>`;
  if (mine.length) h += `<h3>From your schedule</h3><div class="list">${mine.map(x=>row(x,'s:')).join('')}</div>`;
  if (rec.items.length){
    h += `<h3>Recommended · ${rec.plan.title}</h3>
      <p class="muted small">Warm up first: 1 min marching on the spot, 10 arm circles, 10 bodyweight squats.</p>
      <div class="list">${rec.items.map(x=>row(x,'r:')).join('')}</div>`;
    if (cardio) h += `<div class="panel small"><b>Finisher:</b> ${cardio} min of cardio at home. Try 30 sec jumping jacks, 30 sec high knees, 30 sec rest, repeated.</div>`;
  } else {
    h += `<h3>Recovery</h3><div class="list">${STRETCHES.map(([n,d])=>`<div class="check"><span></span><span><span class="name">${n}</span><br><span class="sub">${d}</span></span><span></span></div>`).join('')}</div>`;
  }
  document.getElementById('today-content').innerHTML = h;
}

/* ---------- food ---------- */
const MEALS = [
  // [slot, name, diet(any|veg|vegan), kcal, protein, note]
  ['breakfast','Greek yogurt, berries and oats','veg',380,28,'250 g skyr or Greek yogurt, 40 g oats, a handful of berries'],
  ['breakfast','Scrambled eggs on wholegrain toast','veg',420,26,'3 eggs, 2 slices wholegrain bread, spinach'],
  ['breakfast','Overnight oats with soy milk and peanut butter','vegan',450,20,'60 g oats, 250 ml soy milk, 1 tbsp peanut butter, banana'],
  ['breakfast','Tofu scramble with peppers','vegan',340,24,'200 g firm tofu, peppers, onion, turmeric, 1 slice toast'],
  ['breakfast','Cottage cheese with apple and cinnamon','veg',290,26,'250 g cottage cheese, 1 apple, walnuts'],
  ['lunch','Chicken, rice and roasted vegetables','any',560,45,'150 g chicken breast, 75 g rice (dry), courgette, peppers'],
  ['lunch','Tuna salad wrap','any',430,35,'1 tin tuna, wholegrain wrap, lettuce, tomato, light mayo'],
  ['lunch','Lentil and vegetable soup with bread','vegan',480,24,'100 g red lentils (dry), carrots, celery, 1 slice bread'],
  ['lunch','Chickpea, feta and quinoa bowl','veg',520,24,'Chickpeas, 60 g quinoa (dry), cucumber, 40 g feta'],
  ['lunch','Egg and avocado salad','veg',450,22,'3 boiled eggs, half an avocado, mixed leaves, seeds'],
  ['dinner','Salmon with potatoes and green beans','any',600,40,'150 g salmon, 250 g potatoes, green beans'],
  ['dinner','Lean beef chili with beans','any',580,42,'125 g lean mince, kidney beans, tomatoes, rice or not'],
  ['dinner','Tofu stir-fry with noodles','vegan',540,30,'200 g tofu, wholewheat noodles, broccoli, soy sauce'],
  ['dinner','Turkey meatballs with wholewheat pasta','any',620,45,'150 g turkey mince, 80 g pasta (dry), tomato sauce'],
  ['dinner','Black bean and sweet potato tacos','vegan',560,22,'Black beans, roasted sweet potato, corn tortillas, salsa'],
  ['dinner','Halloumi and vegetable tray bake','veg',590,30,'80 g halloumi, chickpeas, peppers, red onion'],
  ['snack','Protein shake and banana','veg',260,27,'1 scoop whey or pea protein, 1 banana'],
  ['snack','Handful of nuts and an apple','vegan',250,7,'30 g almonds or mixed nuts, 1 apple'],
  ['snack','Hummus with carrot sticks','vegan',200,7,'4 tbsp hummus, carrots, cucumber'],
  ['snack','Boiled eggs','veg',150,13,'2 boiled eggs, pinch of salt'],
  ['snack','Edamame beans','vegan',190,17,'150 g edamame, sea salt'],
  ['snack','Rice cakes with peanut butter','vegan',230,8,'2 rice cakes, 1 tbsp peanut butter']
];
function targets(p){
  const w=+p.weight, h=+p.height, a=+p.age;
  const bmr = 10*w + 6.25*h - 5*a + (p.sex==='m'?5:-161);
  const tdee = bmr * +p.activity * 1.05; // home workouts add a little
  const kcal = Math.round(tdee * ({lose:0.8,gain:1.1,tone:1,endure:1.05}[p.goal]) / 10) * 10;
  const protein = Math.round(w * ({lose:2.0,gain:1.8,tone:1.6,endure:1.5}[p.goal]));
  const fat = Math.round(kcal * ({lose:0.28,gain:0.25,tone:0.3,endure:0.25}[p.goal]) / 9);
  const carbs = Math.max(0, Math.round((kcal - protein*4 - fat*9)/4));
  const water = Math.round(w*0.035*10)/10;
  return {bmr:Math.round(bmr), tdee:Math.round(tdee), kcal, protein, fat, carbs, water};
}
const GOAL_TIPS = {
  lose:['Fill half your plate with vegetables to stay full on fewer calories.','Keep protein high at every meal to protect muscle while you lose fat.','Aim to lose about 0.5 kg per week; faster usually costs muscle.'],
  gain:['Eat protein within a few hours after training.','Gain slowly, around 0.25 kg per week, to keep it mostly muscle.','If the scale stays flat for two weeks, add about 150 kcal a day.'],
  tone:['Spread protein evenly across your meals.','Mostly whole foods; keep treats to a few times a week.','Track your weight weekly; adjust if it drifts more than 1 kg.'],
  endure:['Eat carbs 1 to 3 hours before cardio sessions.','Refuel with carbs and protein after longer workouts.','Drink extra water on cardio days.']
};
function drawFood(){
  const p = P_(), t = targets(p), per = +p.meals;
  const ok = m => p.diet==='any' || (p.diet==='veg' && m[2]!=='any') || (p.diet==='vegan' && m[2]==='vegan');
  const sorter = p.goal==='gain' ? (a,b)=>b[4]-a[4] : p.goal==='lose' ? (a,b)=>(b[4]/b[3])-(a[4]/a[3]) : p.goal==='endure' ? (a,b)=>b[3]-a[3] : (a,b)=>(b[4]/b[3])-(a[4]/a[3]);
  const slots = ['breakfast','lunch','dinner'].concat(per>3?['snack']:[]);
  const kP = t.protein*4/t.kcal*100, kF = t.fat*9/t.kcal*100, kC = Math.max(0,100-kP-kF);
  let h = profile ? '' : `<p class="banner">Showing an <b>example profile</b> (30-year-old woman, 68 kg). Fill in your answers below to get your own numbers.</p>`;
  h += `<div class="panel">
    <div class="row" style="justify-content:space-between"><b>${GOAL_TXT[p.goal]}</b><span class="muted small">Maintenance ≈ ${t.tdee} kcal</span></div>
    <div class="kpis">
      <div class="kpi"><span class="v">${t.kcal}</span><span class="l">kcal / day</span></div>
      <div class="kpi"><span class="v">${t.protein}g</span><span class="l">Protein</span></div>
      <div class="kpi"><span class="v">${t.carbs}g</span><span class="l">Carbs</span></div>
      <div class="kpi"><span class="v">${t.fat}g</span><span class="l">Fat</span></div>
    </div>
    <div class="macro-bar" role="img" aria-label="Protein ${Math.round(kP)}%, carbs ${Math.round(kC)}%, fat ${Math.round(kF)}% of calories"><span class="c-p" style="width:${kP}%"></span><span class="c-c" style="width:${kC}%"></span><span class="c-f" style="width:${kF}%"></span></div>
    <div class="legend"><span><i class="c-p"></i>Protein ${Math.round(kP)}%</span><span><i class="c-c"></i>Carbs ${Math.round(kC)}%</span><span><i class="c-f"></i>Fat ${Math.round(kF)}%</span><span>Water ≈ ${t.water} L</span></div>
    <p class="small muted" style="margin-top:10px">Per meal: about ${Math.round(t.kcal/per/10)*10} kcal and ${Math.round(t.protein/per)} g protein over ${per} eating moments.</p>
  </div>`;
  h += `<div class="panel small"><b>Tips for ${GOAL_TXT[p.goal].toLowerCase()}</b><ul style="margin:6px 0 0;padding-left:18px">${GOAL_TIPS[p.goal].map(x=>`<li>${x}</li>`).join('')}</ul></div>`;
  slots.forEach(s => {
    const list = MEALS.filter(m => m[0]===s && ok(m)).sort(sorter).slice(0,3);
    h += `<h3>${s[0].toUpperCase()+s.slice(1)} ideas</h3><div class="list">${list.map(m=>`<div class="meal"><span class="t">${m[1]}</span><span class="n">≈ ${m[3]} kcal · ${m[4]} g protein</span><span class="small muted">${m[5]}</span></div>`).join('')}</div>`;
  });
  h += `<p class="small muted">Estimates from the Mifflin-St Jeor formula. A general guide, not medical advice; check with a doctor or dietitian if you have a health condition.</p>`;
  document.getElementById('food-results').innerHTML = h;
}
function fillForm(){
  const p = P_(), f = document.getElementById('qform');
  f.querySelector(`input[name=goal][value=${p.goal}]`).checked = true;
  ['sex','age','height','weight','activity','level','diet','meals'].forEach(k => f.elements[k].value = p[k]);
}

/* ---------- schedule ---------- */
function drawSchedule(){
  const total = DAYS.reduce((n,d)=>n+schedule[d].length,0);
  let h = '';
  if (!total){
    h = `<div class="empty"><p><b>Your week is empty.</b></p><p class="small" style="margin-top:4px">Tap a muscle on the body, then <b>+ Schedule</b> on any exercise. Or start from a sample week and edit it.</p>
      <div class="row" style="justify-content:center;margin-top:12px"><button class="btn primary" data-goto="body">Pick a muscle</button><button class="btn" id="sample-week">Load sample week</button></div></div>`;
  }
  DAYS.forEach(d => {
    const items = schedule[d];
    if (!total) return;
    h += `<h3>${DAY_FULL[d]}${d===todayKey()?' · today':''}</h3>`;
    if (!items.length){ h += `<div class="empty small">Rest day. <button class="btn sm" data-goto="body" style="margin-left:6px">Add exercise</button></div>`; return; }
    h += `<div class="list">${items.map((x,i)=>{ const e=EX[x.id]; return `<div class="sched-item">
      <div><div class="name">${esc(e.name)}</div>
        <div class="stepper"><button data-step="${d}|${i}|sets|-1" aria-label="Fewer sets">−</button><span>${x.sets} sets</span><button data-step="${d}|${i}|sets|1" aria-label="More sets">+</button>
        <span style="width:8px"></span><button data-step="${d}|${i}|dose|-1" aria-label="Less">−</button><span>${doseText(x.dose,e.unit)}</span><button data-step="${d}|${i}|dose|1" aria-label="More">+</button></div></div>
      <div class="icon-btns"><button data-move="${d}|${i}|-1" aria-label="Move up">↑</button><button data-move="${d}|${i}|1" aria-label="Move down">↓</button><button data-del="${d}|${i}" aria-label="Remove">✕</button></div>
    </div>`;}).join('')}</div>`;
  });
  document.getElementById('sched-content').innerHTML = h;
  document.getElementById('clear-sched').hidden = !total;
}
function sampleWeek(){
  const s = (id,sets=3) => ({id, sets, dose:EX[id].dose});
  schedule = {mon:[s('pushup'),s('pike-pushup'),s('chair-dip'),s('plank')], tue:[s('squat'),s('lunge'),s('glute-bridge'),s('calf-raise')], wed:[],
    thu:[s('door-row'),s('backpack-curl'),s('yt-raise'),s('dead-bug')], fri:[], sat:[s('step-up'),s('sl-rdl'),s('side-plank',2),s('mountain',2)], sun:[]};
  store.set('schedule', schedule); render(); toast('Sample week loaded. Edit it any way you like.');
}

/* ---------- render + events ---------- */
function setTab(t){
  ui.tab = t; store.set('tab', t);
  ['body','today','food','sched'].forEach(k => {
    document.getElementById('v-'+k).hidden = k!==t;
    document.getElementById('t-'+k).setAttribute('aria-selected', k===t);
  });
  render(); window.scrollTo({top:0});
}
function render(){
  if (ui.tab==='body'){ drawFigure(); drawGroupDetail(); }
  if (ui.tab==='today') drawToday();
  if (ui.tab==='food') drawFood();
  if (ui.tab==='sched') drawSchedule();
}

document.addEventListener('click', ev => {
  const t = ev.target.closest('[data-tab],[data-g],[data-add],[data-info],[data-close],[data-day],#save-days,[data-pickday],[data-goto],[data-step],[data-move],[data-del],#sample-week,#clear-sched,#side-front,#side-back');
  if (!t) return;
  if (t.dataset.close && ev.target!==t && t.classList.contains('scrim')) return;
  if (t.dataset.tab) return setTab(t.dataset.tab);
  if (t.id==='side-front' || t.id==='side-back'){ ui.side = t.id==='side-front'?'front':'back';
    const list = ui.side==='front'?FRONT:BACK; if (ui.group && !list.includes(ui.group)) ui.group=null; drawFigure(); drawGroupDetail(); return; }
  if (t.dataset.g) return selectGroup(t.dataset.g, t.tagName==='path' ? undefined : false);
  if (t.dataset.add) return addSheet(t.dataset.add);
  if (t.dataset.info) { ev.preventDefault(); return infoSheet(t.dataset.info); }
  if (t.dataset.close) return closeSheet();
  if (t.dataset.day){ t.setAttribute('aria-pressed', t.getAttribute('aria-pressed')!=='true'); return; }
  if (t.id==='save-days') return saveDays(t.dataset.ex);
  if (t.dataset.pickday){ ui.day = t.dataset.pickday; return drawToday(); }
  if (t.dataset.goto) return setTab(t.dataset.goto);
  if (t.id==='sample-week') return sampleWeek();
  if (t.id==='clear-sched'){
    if (t.dataset.armed){ schedule = Object.fromEntries(DAYS.map(d=>[d,[]])); store.set('schedule',schedule); delete t.dataset.armed; t.textContent='Clear week'; render(); return toast('Week cleared'); }
    t.dataset.armed='1'; t.textContent='Tap again to clear'; setTimeout(()=>{ delete t.dataset.armed; t.textContent='Clear week'; }, 3000); return;
  }
  if (t.dataset.step){ const [d,i,f,dir] = t.dataset.step.split('|'); const x = schedule[d][+i], e = EX[x.id];
    if (f==='sets') x.sets = Math.min(8, Math.max(1, x.sets + +dir));
    else { const st = e.unit==='sec' ? 5 : 1; x.dose = Math.max(st, x.dose + st * +dir); }
    store.set('schedule', schedule); return drawSchedule(); }
  if (t.dataset.move){ const [d,i,dir] = t.dataset.move.split('|'), a = schedule[d], j = +i + +dir;
    if (j<0 || j>=a.length) return; [a[+i],a[j]] = [a[j],a[+i]]; store.set('schedule',schedule); return drawSchedule(); }
  if (t.dataset.del){ const [d,i] = t.dataset.del.split('|'); const name = EX[schedule[d][+i].id].name; schedule[d].splice(+i,1); store.set('schedule',schedule); drawSchedule(); return toast(`${name} removed`); }
});
document.addEventListener('keydown', ev => {
  if (ev.key==='Escape') closeSheet();
  if ((ev.key==='Enter'||ev.key===' ') && ev.target.matches('path.m')){ ev.preventDefault(); selectGroup(ev.target.dataset.g); }
});
document.addEventListener('change', ev => {
  const c = ev.target.closest('[data-done]'); if (!c) return;
  const k = c.dataset.date, s = new Set(doneLog[k]||[]);
  c.checked ? s.add(c.dataset.done) : s.delete(c.dataset.done);
  doneLog[k] = [...s]; store.set('done', doneLog); drawToday();
});
document.getElementById('qform').addEventListener('submit', ev => {
  ev.preventDefault();
  const f = ev.target, v = Object.fromEntries(new FormData(f));
  if (!v.goal) return toast('Choose a main goal first');
  for (const [k,min,max,lab] of [['age',14,90,'age'],['height',120,230,'height in cm'],['weight',35,250,'weight in kg']]){
    const n = +v[k]; if (!(n>=min && n<=max)) return toast(`Enter a ${lab} between ${min} and ${max}`);
  }
  profile = v; store.set('profile', profile); drawFood(); window.scrollTo({top:0,behavior:'smooth'}); toast('Saved. Your plan is updated.');
});

document.getElementById('today-date').textContent = new Date().toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'short'});
fillForm();
setTab(['body','today','food','sched'].includes(ui.tab) ? ui.tab : 'body');
</script>
